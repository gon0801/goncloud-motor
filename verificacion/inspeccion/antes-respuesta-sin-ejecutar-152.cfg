\* Código anterior a #152: cli.paso llama a barrer antes de continuar_respuestas, así
\* que el revisor se lanza con un sí o un no todavía sin ejecutar. Se espera que la
\* propiedad de acción RevisorEsperaLaRespuesta falle.
SPECIFICATION Spec
CONSTANTS
  MaxIds = 3
  Tope = 3
  RegistraAlLigar = TRUE
  ReligaSinSolicitud = TRUE
  LigaHuerfanaBloquea = FALSE
  DetieneLaPendiente = TRUE
  AjusteAbre = TRUE
  AjusteSuelta = TRUE
  RespuestaReabre = TRUE
  RecuerdaCarpeta = TRUE
  SoloMataLoDelTurno = TRUE
  RespuestaVigente = TRUE
  FrenoCuenta = TRUE
  AvisaPregunta = TRUE
  AntesPreguntaCallada = FALSE
  AntesFrenoContinuar = FALSE
  AntesRespuestaSinEjecutar = TRUE
CONSTRAINT DentroDeLaCota
INVARIANTS TypeOK
PROPERTY RevisorEsperaLaRespuesta
