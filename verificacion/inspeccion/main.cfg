\* main (código que corrige este cambio): ci.correr sobrevive al turno, su resultado
\* siempre llega, las preguntas son avisos sin espera humana, el freno no reabre al
\* continuar y la respuesta se ejecuta antes de lanzar al revisor.
SPECIFICATION Spec
CONSTANTS
  MaxIds = 3
  \* Tope es dominio.TOPE_NO_CONCLUYENTES: lo exigen verificar.sh (sale 2 si difiere) y tests/test_tope_del_modelo.py
  Tope = 3
  RegistraAlLigar = TRUE
  ReligaSinSolicitud = TRUE
  LigaHuerfanaBloquea = FALSE
  DetieneLaPendiente = TRUE
  AjusteAbre = TRUE
  AjusteSuelta = TRUE
  RespuestaReabre = TRUE
  RecuerdaCarpeta = TRUE
  SoloMataLoDelTurno = TRUE
  RespuestaVigente = TRUE
  FrenoCuenta = TRUE
  AvisaPregunta = TRUE
  AntesPreguntaCallada = FALSE
  AntesFrenoContinuar = FALSE
  AntesRespuestaSinEjecutar = FALSE
CONSTRAINT DentroDeLaCota
INVARIANTS TypeOK ResultadoEntregado SinAtascoMudo SinCarrera ImpedimentoConSalida CorridaSobreviveAlTurno PreguntaVisible RespuestaMueve FrenoVisible FrenoRevisor EsperaConSalida PreguntaNuncaCallada FrenoSinReabrir
PROPERTY AlTopeEspera RevisorEsperaLaRespuesta
