title = "goncloud-motor"

[extend]
useDefault = true

[[allowlists]]
description = "Evidencia historica y fixture ya aceptados en .gitleaksignore, solo para las reglas que los marcaron. El commit sintetico que el CI crea para probar el producto reescribe el arbol completo, asi que sus huellas cambian de commit y no las cubre .gitleaksignore."
targetRules = ["generic-api-key", "sentry-access-token", "discord-api-token"]
paths = [
    '''docs/evidence/correcciones-3-4/componentes-final-mini\.json$''',
    '''docs/evidence/correcciones-3-4/componentes-final-pc\.json$''',
    '''docs/evidence/correcciones-3-4/final-directores\.json$''',
    '''tests/test_pstack\.py$''',
]
