name: Quality

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Instalar las herramientas de calidad
        run: python -m pip install pyright==1.1.414 ruff==0.17.4
      - name: Tipos, solo lo nuevo
        run: python tools/calidad.py tipos
      - name: Lint, solo lo nuevo
        run: python tools/calidad.py lint
      - name: Lectura y escritura de texto, solo lo nuevo
        run: python tools/calidad.py io
      - name: Ningún archivo ni función de motor/ crece por encima de su límite
        run: python tools/calidad.py tamano
      - name: Marcadores que deciden, anotados como eventos
        run: python tools/calidad.py marcadores
      - name: La tabla de decisiones se genera desde su fuente única
        run: python tools/calidad.py politica
      - name: Una sola puerta publica el cuerpo del PR
        run: python tools/candados.py cuerpo
      - name: La configuración de secretos no se debilita en silencio
        run: python tools/candados.py secretos
      - name: Compilar el codigo
        run: python -m compileall -q motor ops proto tests conftest.py
      - name: Escanear secretos en todo el historial
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --no-banner -v .
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  nuevas-en-rojo:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar pytest
        run: python -m pip install pytest
      - name: Las pruebas nuevas fallan contra la base del PR
        run: python tools/pruebas_nuevas.py --base "origin/${{ github.base_ref }}"
