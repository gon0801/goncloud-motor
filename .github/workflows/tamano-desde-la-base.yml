name: Tamaño juzgado desde la base

# El paso de tamaño del job `gate` corre el código del propio PR, que puede
# debilitarlo. Este corre el workflow de la rama base y el `tools/calidad.py` de
# su punta: del PR solo trae objetos de git y los lee como datos; nada suyo se
# ejecuta.
on:
  pull_request_target:

permissions:
  contents: read

jobs:
  tamano-desde-la-base:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout de la base, que es el código que juzga
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Lo que el PR dejaría en la base no crece por encima de su límite
        env:
          CABEZA_DEL_PR: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ ! "$CABEZA_DEL_PR" =~ ^[0-9a-f]{40}$ ]]; then
            echo "tamano: la cabeza del PR no es un SHA válido" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != refs/heads/* ]]; then
            echo "tamano: GITHUB_REF no es una rama: ${GITHUB_REF}" >&2
            exit 1
          fi
          # La base es la punta de hoy de la rama, no el commit del evento: un
          # re-run repite ese commit, y `tamano-al-avanzar-la-base.yml` repite
          # este job cada vez que la base avanza.
          git fetch --no-tags --quiet origin \
            "+${GITHUB_REF}:refs/remotes/base/punta" "+${CABEZA_DEL_PR}:refs/remotes/pr/cabeza"
          base=$(git rev-parse refs/remotes/base/punta)
          # El juez también es el de la punta: un re-run trae el checkout del evento.
          git checkout --quiet --detach "$base"
          # Se mide la unión y no la cabeza sola: lo que entra a la base es la unión.
          if ! arbol=$(git merge-tree --write-tree "$base" "$CABEZA_DEL_PR"); then
            echo "::error::tamano: el PR choca con la base; actualiza la rama para medir lo que entraría" >&2
            exit 1
          fi
          union=$(git -c user.name=tamano -c user.email=tamano@localhost \
            commit-tree "$arbol" -p "$base" -p "$CABEZA_DEL_PR" -m "unión del PR con la base")
          echo "tamano: la unión de ${CABEZA_DEL_PR} con ${base} es ${union}"
          python3 tools/calidad.py tamano --base "$base" --cabeza "$union"
