name: Pruebas

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  jaula-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MOTOR_EXIGE_BWRAP: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 veda los espacios de nombres de usuario sin perfil de AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: La jaula de bubblewrap arranca
        run: bwrap --unshare-all --ro-bind /usr /usr --symlink usr/bin /bin --symlink usr/lib /lib --symlink usr/lib64 /lib64 --proc /proc --dev /dev -- /usr/bin/true
      - name: Jaula de bubblewrap (con MOTOR_EXIGE_BWRAP=1 un skip es un fallo)
        run: python -m unittest tests.test_jaula_linux tests.test_jaula_wsl tests.test_rutas_wsl tests.test_ci_jaula tests.test_bucle_instrumento.ShellDeGitAlLanzar tests.test_bucle_instrumento.SondaDeWsl tests.test_bucle_instrumento.ElShellDelCli tests.test_bucle_instrumento.EnsayoDelOperador tests.test_bucle_instrumento.SondaDelShellDeGit -v

  ops-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Pruebas de shell de ops/tests
        run: bash ops/tests/correr.sh

  bateria:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 veda los espacios de nombres de usuario sin perfil de AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Bateria completa
        run: python -m unittest discover -s tests -t . -v

  macos:
    name: Lanzamiento directo en macOS
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: El lanzamiento directo y su entorno en la Mac
        run: python -m unittest -v tests.test_lanzamiento_directo tests.test_director_capacidades tests.test_sesion_interprete tests.test_comprobador_temporal

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Con esta marca, una prueba propia de Windows que se salte es un fallo.
      MOTOR_EXIGE_WINDOWS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Pruebas propias de Windows
        run: python -m unittest -v tests.test_windows tests.test_windows_identidad tests.test_windows_wsl tests.test_relanzamiento_pc tests.test_prepara_pc tests.test_director_capacidades
      - name: La preparacion deja verificar.sh corriendo (JDK y jar reales, Git Bash real, TLC real)
        shell: bash
        run: python ops/prepara_pc.py --base "${RUNNER_TEMP}/base-prepara" --verificar main.cfg
