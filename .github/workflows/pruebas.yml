name: Pruebas

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ops_tests: ${{ steps.jobs.outputs.ops_tests }}
      bateria: ${{ steps.jobs.outputs.bateria }}
      macos: ${{ steps.jobs.outputs.macos }}
      windows: ${{ steps.jobs.outputs.windows }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # El filtro va en cada job, no en `paths` del disparador: un job saltado
      # por su `if` cuenta como éxito para la protección de rama; un workflow
      # saltado por `paths` deja sus checks pendientes y bloquea el merge.
      - name: Decidir qué jobs toca el cambio
        id: jobs
        run: python3 -m motor.encargos.trabajos_ci --github-output

  ops-tests:
    needs: prep
    if: always() && needs.prep.outputs.ops_tests != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Pruebas de shell de ops/tests
        run: bash ops/tests/correr.sh

  bateria-partes:
    name: bateria-parte-${{ matrix.parte }}
    needs: prep
    if: always() && needs.prep.outputs.bateria != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        parte: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Parte de la bateria
        run: python -m tests.reparto correr --parte ${{ matrix.parte }}

  # El check que mira la protección se llama bateria. Verde solo si las cuatro
  # partes pasaron. Si el filtro de prep lo salta, GitHub lo cuenta como éxito.
  bateria:
    needs: [prep, bateria-partes]
    if: always() && needs.prep.outputs.bateria != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: La division cubre el discover
        run: python -m tests.reparto comprobar
      - name: Las cuatro partes pasaron
        if: always()
        run: python -m tests.reparto exigir --resultado "${{ needs.bateria-partes.result }}"

  macos:
    name: Lanzamiento directo en macOS
    needs: prep
    if: always() && needs.prep.outputs.macos != 'false'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: El lanzamiento directo y su entorno en la Mac
        run: python -m unittest -v tests.test_lanzamiento_directo tests.test_lanzamiento_directo_windows tests.test_director_capacidades tests.test_sesion_interprete tests.test_comprobador_temporal

  windows:
    needs: prep
    if: always() && needs.prep.outputs.windows != 'false'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Con esta marca, una prueba propia de Windows que se salte es un fallo.
      MOTOR_EXIGE_WINDOWS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Pruebas propias de Windows
        run: python -m unittest -v tests.test_windows tests.test_windows_identidad tests.test_windows_wsl tests.test_lanzamiento_directo_windows tests.test_relanzamiento_pc tests.test_prepara_pc tests.test_director_capacidades
      - name: Recetas de encargos con Git Bash y recuperación
        run: python -m unittest -v tests.test_encargos_despliegue_real tests.test_despliegue_recuperacion
      - name: La preparacion deja verificar.sh corriendo (JDK y jar reales, Git Bash real, TLC real)
        shell: bash
        run: python ops/prepara_pc.py --base "${RUNNER_TEMP}/base-prepara" --verificar main.cfg
