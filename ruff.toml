target-version = "py312"
exclude = [".interno", ".audit"]
line-length = 100

[lint]
select = ["E4", "E7", "E9", "F", "B", "S102", "S307"]

[lint.per-file-ignores]
# exec y eval esconden código del límite de tamaño: un string de mil líneas cuesta
# unos pocos tokens. La regla es para motor/; las pruebas los usan para cargar
# módulos de prueba.
"!motor/**" = ["S102", "S307"]
